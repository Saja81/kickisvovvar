<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Om Kickis Vovvar</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script defer src="script.js"></script>
  </head>
  <body id="top">
    <!-- Hero-sektion -->
    <header class="hero">
      <img
        class="hero-image"
        src="hero-hund.jpg"
        alt="Hund från Kickis Vovvar"
        width="4592"
        height="3056"
        decoding="async"
      />
    </header>

    <!-- Navigation -->
    <nav>
      <div class="nav-container">
        <button class="hamburger" aria-label="Öppna meny">&#9776;</button>
        <ul class="nav-links">
          <li><a href="index.html">Hem</a></li>
          <li><a href="om-kickis-vovvar.html">Om Kickis vovvar</a></li>
          <li><a href="adoptionsprocessen.html">Adoptionsprocessen</a></li>
          <li>
            <a href="hundar-som-soker-hem.html">Hundar som söker nytt hem</a>
          </li>
          <li><a href="volontarer.html">Våra volontärer</a></li>
          <li><a href="solskenshistorier.html">Våra solskenshistorier</a></li>
          <li><a href="bra-info.html">Bra info</a></li>
          <li><a class="active" href="kontakt.html">Kontakt</a></li>
        </ul>
      </div>
    </nav>

    <!-- Main content -->
    <main>
      <section class="interest-form-section">
        <div class="container">
          <h2>Intresseanmälan</h2>

          <form
            name="intresseanmalan"
            method="POST"
            data-netlify="true"
            id="interestForm"
          >
            <input type="hidden" name="form-name" value="intresseanmalan" />
            <input type="hidden" name="redirect" value="/bekraftelse.html" />

            <label>Hundens namn</label>
            <input type="text" name="hund" required />

            <label>Sökandes namn</label>
            <input type="text" name="namn" required />

            <label>Sökandes telefonnummer</label>
            <input type="tel" name="telefon" required />

            <label>Sökandes e-post</label>
            <input type="email" name="epost" required />

            <label>Berätta om ditt intresse</label>
            <textarea name="meddelande" rows="6" required></textarea>

            <div class="checkbox-wrap">
              <input type="checkbox" id="costCheck" />
              <label for="costCheck">
                Jag är medveten om att adoptionskostnaden är 7000:-
              </label>
            </div>

            <button type="submit" id="submitBtn" disabled>Skicka in</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Kickis Vovvar i Rumänien</p>
    </footer>
  </body>
</html>
